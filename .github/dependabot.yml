# .github/dependabot.yml - Actualizaciones de dependencias en bajo ruido: 1 PR/mes agrupado, sin majors. Las alertas de seguridad siguen llegando aparte (pestaña Security).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 1
    labels:
      - "dependencies"
    groups:
      # Una sola PR mensual con todas las actualizaciones menores/patch seguras.
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Los majors (cambios potencialmente rompedores) se gestionan a mano cuando toque.
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
